name: CI

on:
  push:
    branches: [ main, master, release-* ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} • ${{ matrix.os }} • ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.10', 'nightly' ]
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
        arch: [ x64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}


      - uses: julia-actions/cache@v1
        with:
          cache-registries: true  # cachuje też rejestry (General)
          cache-packages: true    # cachuje artefakty i pakiety

      # Budowa/instalacja projektu (Pkg.build + instantiate + precompile)
      - uses: julia-actions/julia-buildpkg@v1

      # Testy (Pkg.test()) w kontekście repo (czyli --project=.)
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}

      # Coverage -> lcov.info
      - uses: julia-actions/julia-processcoverage@v1

      # Upload do Codecov
      - uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false
